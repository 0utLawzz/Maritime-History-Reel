kind = "web"
previewPath = "/"
title = "Video Studio Dashboard"
version = "1.0.0"
id = "artifacts/studio-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20958

[services.development]
run = "pnpm --filter @workspace/studio-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/studio-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/studio-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20958"
BASE_PATH = "/"
